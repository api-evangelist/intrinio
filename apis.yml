name: Intrinio
description: >-
  Intrinio is a financial data platform delivering real-time, delayed, and historical US
  stock prices, options data with Greeks and implied volatility, standardized and
  as-reported company fundamentals, analyst estimates, ETF and mutual fund holdings,
  indices, corporate actions, and ESG data through a REST API, WebSocket streaming feeds,
  bulk files, Snowflake and S3 delivery, and an official hosted MCP server that connects
  Claude, ChatGPT, Cursor, and other AI assistants directly to its data catalog.
