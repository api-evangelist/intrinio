data_coverage:
- Stock Prices (real-time, delayed, 50+ years historical OHLCV, US equities and global indices)
- Options (full chains, Greeks, implied volatility, unusual activity)
- Fundamentals (15+ years standardized and as-reported statements, ratios, metrics, 9,000+ companies)
- Estimates (analyst consensus EPS, revenue, EBITDA, long-term growth, price targets)
- ETFs & Funds (holdings, weights, analytics, 118+ metadata attributes)
- Indices, Corporate Actions, ESG, Mutual Funds
